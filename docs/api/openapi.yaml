    post:
      tags:
      - Maintenance
      summary: Apply Convert Zeroed To Skipped
      description: 'Converts specified transaction IDs with amount = 0.0 to be is_skipped
        = 1.

        Also restores the original amount from the recurrence template (non-destructive
        approach).'
      operationId: apply_convert_zeroed_to_skipped_api_maintenance_convert_zeroed_to_skipped_apply_post
      requestBody:
        content:
          application/json:
            schema:
              items:
                type: integer
              type: array
              title: Tx Ids
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
