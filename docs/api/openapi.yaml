tags:
- name: transactions
  description: Gestion des opérations financières (dépenses, revenus, virements internes,
    pointage bancaire et ventilation budgétaire).
- name: accounts
  description: Gestion des comptes bancaires (courants, livrets d'épargne, soldes
    initiaux et archivage).
- name: categories
  description: Arborescence hiérarchique des catégories et sous-catégories de dépenses
    et recettes.
- name: budgets
  description: Enveloppes budgétaires mensuelles/annuelles, plafonds, ventilation
    multi-catégories et suggestions d'économies.
- name: autopilot
  description: 'Centre de contrôle de l''Auto-Pilote : découverte d''enveloppes, recalibrage
    prédictif EMA, saut automatique et registre de décisions réversibles.'
- name: recurrences
  description: Échéancier financier et modèles d'opérations périodiques (abonnements,
    loyers, salaires, propagation d'échéances).
- name: bank-sync
  description: 'Synchronisation bancaire directe locale (Woob) : coffre-fort d''identifiants
    chiffré AES-256 (Fernet) et sas de validation sécurisé.'
- name: smart-labels
  description: Normalisation intelligente des libellés bancaires vers tiers marchands
    et règles de pré-catégorisation.
- name: chat
  description: 'Assistant financier IA 100% hors-ligne (Ollama) : RAG local sur données
    financières, synthèse en langage naturel et Function Calling sécurisé.'
- name: ai
  description: Services d'enrichissement et d'assistance prédictive par intelligence
    artificielle locale.
- name: stats
  description: 'Moteur analytique : bilans financiers, répartition par catégorie,
    reste à vivre, tendances temporelles et métriques de trésorerie.'
- name: simulator
  description: Simulateur patrimonial et prospectif de trésorerie (1 à 30 ans, multi-scénarios,
    modélisation de l'inflation et saisonnalité).
- name: history
  description: Journal d'audit complet, traçabilité des modifications, snapshots différentiels
    (diffs JSON) et moteur Undo/Redo.
- name: profiles
  description: Gestion des profils de travail étanches (Personnel, Professionnel,
    Association) avec isolation des bases SQLite.
- name: cross-profile
  description: 'Opérations inter-profils : virements miroirs et équilibrage croisé.'
- name: csv
  description: 'Pipeline d''importation de relevés CSV : détection automatique des
    dialectes bancaires, vérification des doublons et réconciliation.'
- name: backup
  description: 'Sauvegardes manuelles : création d''archives SQLite, téléchargement
    et restauration de bases de données.'
- name: auto_backup
  description: Sauvegardes automatiques périodiques et gestion des politiques de rétention.
- name: maintenance
  description: 'Maintenance de la base de données : optimisation SQLite (VACUUM /
    ANALYZE), vérification de cohérence d''intégrité et recalcul des soldes.'
- name: notifications
  description: 'Centre de notifications et alertes : bilans périodiques, dépassements
    budgétaires, anomalies détectées et rappels d''échéances.'
- name: config
  description: 'Configuration globale de l''application : devise, langue, endpoint
    Ollama, seuils planchers et préférences d''affichage.'
- name: license
  description: Gestion de la licence OmniBank et activation du Mode Organisation (CSE
    / Association).
- name: OrgUsers
  description: Gestion des utilisateurs et rôles en Mode Organisation (administrateurs,
    trésoriers, auditeurs).
- name: setup
  description: 'Assistant de premier démarrage : initialisation guidée des comptes
    et paramètres initiaux.'
- name: diagnostics
  description: 'Outils de diagnostic technique : état des services internes, métriques
    de latence et journal des erreurs backend.'
- name: system
  description: 'Endpoints système : santé du serveur (health check), version de l''application,
    changelog dynamique et téléversement de fichiers.'
