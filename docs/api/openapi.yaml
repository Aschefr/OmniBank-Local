    get:
      tags:
      - Maintenance
      summary: Preview Convert Zeroed To Skipped
      description: "Finds templates whose generation is currently blocked by zeroed\
        \ transactions,\nand where converting them to 'skipped' would unblock generation\
        \ with a valid amount.\n\nA template is shown only if:\n1. It is active (not\
        \ closed)\n2. Its latest confirmed (non-skipped) transaction has amount ==\
        \ 0.0\n3. It has at least one confirmed transaction with amount > 0 in its\
        \ history\n   (so there's a valid fallback amount to resume generation with)\n\
        \nOnly the consecutive 0€ tail transactions are shown (the ones blocking generation)."
      operationId: preview_convert_zeroed_to_skipped_api_maintenance_convert_zeroed_to_skipped_preview_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
